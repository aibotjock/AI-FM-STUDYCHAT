services:
  studychat:
    build: .
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      STUDY_ACCESS_TOKEN: ${STUDY_ACCESS_TOKEN:?Set a long random access token in .env first}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - studychat-data:/app/data
    restart: unless-stopped
volumes:
  studychat-data:
